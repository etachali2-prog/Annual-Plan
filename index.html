<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Annual Maintenance Plan</title>

    <style>

        /* GENERAL SETTINGS */

        * {
            box-sizing: border-box;
        }

        body {
            background-image:
                linear-gradient(
                    rgba(0, 30, 70, 0.45),
                    rgba(0, 30, 70, 0.45)
                ),
                url("machine-background.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        /* PAGE TITLE */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #003366;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #008080;
            font-size: 23px;
            margin: 0;
        }

        .header p {
            color: #555;
            font-size: 16px;
            margin-top: 10px;
        }

        /* TABLE CONTAINER */

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
        }

        /* TABLE */

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 900px;
            background-color: rgba(255, 255, 255, 0.97);
        }

        th,
        td {
            border: 1px solid #b5c7d8;
            padding: 12px 10px;
            text-align: center;
        }

        th {
            background: linear-gradient(135deg, #005b96, #007f9e);
            color: white;
            font-size: 15px;
        }

        td {
            color: #222;
            font-size: 14px;
        }

        tr:nth-child(even) {
            background-color: #eaf5fa;
        }

        tr:hover {
            background-color: #d5ecf5;
        }

        /* TABLE HEADER */

        .main-header {
            background-color: #b7dee8;
            color: #003366;
        }

        /* ACTIVITY COLUMN */

        .activity {
            text-align: left;
            font-weight: bold;
        }

        /* MONTH COLUMNS */

        .month {
            width: 55px;
            min-width: 55px;
        }

        /* SCHEDULE COLORS */

        .schedule {
            background-color: #eeeeee;
        }

        .blue {
            background-color: #0066ff;
            color: white;
        }

        .aqua {
            background-color: #00cccc;
        }

        .violet {
            background-color: blueviolet;
            color: white;
        }

        .green {
            background-color: #00a651;
            color: white;
        }

        .orange {
            background-color: #ff9800;
            color: white;
        }

        /* BUTTON AREA */

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        /* PM SCHEDULE BUTTON */

        .pm-button {
            display: inline-block;

            background: linear-gradient(
                135deg,
                #0066cc,
                #003366
            );

            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;

            padding: 16px 45px;
            border-radius: 50px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

            transition: 0.3s;
        }

        .pm-button:hover {
            background: linear-gradient(
                135deg,
                #00a651,
                #006633
            );

            transform: translateY(-4px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 13px;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
            }

            .header h1 {
                font-size: 23px;
            }

            .header h2 {
                font-size: 18px;
            }

            .pm-button {
                font-size: 17px;
                padding: 13px 30px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <h1>
                MELBA PRINTING PUBLISHING & PACKAGING S.C.
            </h1>

            <h2>
                Technical Department
            </h2>

            <h2>
                Annual Maintenance Plan
            </h2>

            <p>
                Reliable Machines | Better Production | Higher Efficiency
            </p>

        </div>

        
        <div class="button-container">

            <a
                class="pm-button"
                href="https://etachali2-prog.github.io/Daily-Maintenance-Work/"
                target="_blank">

                ⚙ PM Schedule ➜

            </a>
             <a
                class="pm-button"
                href="https://etachali2-prog.github.io/all/"
                target="_blank">

                <---Back

            </a>

        </div>

        <!-- FOOTER -->

        <div class="footer">

            <p>
                MELBA PRINTING PUBLISHING & PACKAGING S.C.
                | Technical Department
            </p>

        </div>

    </div>

</body>

</html>
